# C.H.A.O.S — single-host deployment (infrastructure-design/deployment-architecture.md).
#
# ⚠️ ONLY 80 AND 443 ARE PUBLISHED. The app's port 3000 and PostgreSQL's 5432 are reachable only on
# the internal compose network. Publishing 5432 "temporarily for debugging" is how an internal
# database ends up on the internet; use `docker compose exec db psql` instead, which needs no
# published port at all.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # NAMED volume, not a bind mount: the data survives `docker compose down` and is not exposed
      # to host filesystem permissions. See the `down -v` warning in the README.
      - chaos_db_data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` with the real user and database, so the check fails while PostgreSQL is up but
      # still recovering — which is exactly when the app must not yet start migrating.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # No `ports:` — deliberately. The database is not reachable from the host.
    networks: [chaos]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        # Waits for the HEALTHCHECK, not merely for the container to exist. Without this condition
        # the app starts, fails to connect, and exits — repeatedly.
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Composed from the same values as the db service, so there is one place to change a password.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-chaos_session}
      # TRUE in production: TLS terminates at Caddy, and a cookie without Secure can be sent in
      # cleartext if anything ever reaches the app over plain HTTP.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      CONTRACT_EXPIRY_WARN_DAYS: ${CONTRACT_EXPIRY_WARN_DAYS:-30}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-19456}
      ARGON2_ITERATIONS: ${ARGON2_ITERATIONS:-2}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
      # Used ONCE, on a database with no accounts. Remove both after the first sign-in.
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      STATIC_DIR: /app/public
    healthcheck:
      # Hits the app's own /health, which reports database connectivity — so an app that is
      # listening but cannot reach the database is reported unhealthy rather than ready.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No `ports:` — reached only through the proxy.
    networks: [chaos]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      CHAOS_HOSTNAME: ${CHAOS_HOSTNAME:-localhost}
    ports:
      # The ONLY published ports in the whole stack.
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME state must persist, or every restart re-requests them and hits rate
      # limits.
      - chaos_caddy_data:/data
      - chaos_caddy_config:/config
    networks: [chaos]

volumes:
  chaos_db_data:
  chaos_caddy_data:
  chaos_caddy_config:

networks:
  chaos:
    driver: bridge
